<p-toolbar ariaLabelledBy="episode-selection-count" [attr.aria-busy]="pending()">
    <div class="actions">
        <p-button
            label="Auswahl abbrechen"
            severity="secondary"
            [disabled]="pending()"
            (onClick)="cancel.emit()"
        />
        <strong id="episode-selection-count" aria-live="polite"
            >{{ count() }} von {{ total() }} ausgewählt</strong
        >
        <div class="selection-buttons">
            <p-button
                [label]="total() && count() === total() ? 'Alle abwählen' : 'Alle auswählen'"
                [disabled]="pending() || !total()"
                (onClick)="toggleAll.emit()"
                [outlined]="true"
            />
            <p-button
                [label]="count() + (count() === 1 ? ' Episode ' : ' Episoden ') + actions[mode()]"
                [loading]="pending()"
                [disabled]="pending() || !count() || reloadStatus() === 'required'"
                (onClick)="proceed.emit()"
            />
        </div>
        @if (error()) {
            <span role="alert">{{ error() }}</span>
        }
        @if (reloadStatus()) {
            <p-button label="Trackliste neu laden" [disabled]="pending()" (onClick)="reload.emit()" />
        }
    </div>
</p-toolbar>
