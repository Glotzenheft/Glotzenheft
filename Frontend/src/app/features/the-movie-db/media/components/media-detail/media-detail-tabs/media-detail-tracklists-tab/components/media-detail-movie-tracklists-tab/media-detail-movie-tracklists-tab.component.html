<section class="movie-tracklists" aria-labelledby="movie-tracklists-heading">
    <header class="movie-tracklists-header">
        <h2 id="movie-tracklists-heading">
            Tracklisten <span class="tracklist-count">({{ mediaData.tracklists.length }})</span>
        </h2>
        <p-button label="Neue Trackliste anlegen" icon="pi pi-plus" (onClick)="createTracklist()" />
    </header>

    @if (mediaData.tracklists.length === 0) {
        <div class="empty-tracklists" role="status">
            <i class="pi pi-list" aria-hidden="true"></i>
            <p>Für diesen Film hast du noch keine Trackliste angelegt.</p>
            <span>Lege eine Trackliste an, um deine Sichtung zu erfassen.</span>
        </div>
    } @else {
        <div class="movie-tracklist-grid">
            @for (tracklist of mediaData.tracklists; track tracklist.id) {
                <app-tracklist-card
                    [tracklist]="tracklist"
                    [media]="mediaData.media"
                    (edit)="editTracklist($event)"
                    (updated)="updateTracklist($event)"
                />
            }
        </div>
    }
</section>
