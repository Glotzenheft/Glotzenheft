<div class="media-detail-tracklist-tab-container">
    @if (state.mediaData(); as data) {
        @if (data.media.type === MediaType.MOVIE) {
            <app-media-detail-movie-tracklists-tab [mediaData]="data"></app-media-detail-movie-tracklists-tab>
        } @else if (data.media.type === MediaType.TV_SHOW) {
            <app-media-detail-tv-series-tracklists-tab [mediaData]="data"></app-media-detail-tv-series-tracklists-tab>
        }
    }
</div>
