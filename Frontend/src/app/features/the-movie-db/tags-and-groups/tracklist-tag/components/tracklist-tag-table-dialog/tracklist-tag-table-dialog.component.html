<div class="tracklist-tag-table-dialog">
    <div class="tracklist-tag-table-actions">
        <p-button
            label="Alle Tag-IDs kopieren"
            icon="pi pi-copy"
            [outlined]="true"
            [disabled]="!tags.length"
            (onClick)="copyTagIds(tags)"
        />
    </div>
    <div class="tag-table-wrapper">
        <table class="tracklist-tag-table">
            <thead>
                <tr>
                    <th scope="col">Kategorie</th>
                    <th scope="col">Tags</th>
                </tr>
            </thead>
            <tbody>
                @for (category of categories(); track category.value) {
                    <tr>
                        <th scope="row">
                            <span>{{ category.label }}</span>
                            <p-button
                                icon="pi pi-copy"
                                [text]="true"
                                [rounded]="true"
                                size="small"
                                [disabled]="!category.tags.length"
                                [ariaLabel]="'Tag-IDs der Kategorie ' + category.label + ' kopieren'"
                                (onClick)="copyTagIds(category.tags)"
                            />
                        </th>
                        <td>
                            <div class="category-tags">
                                @for (tag of category.tags; track tag.id) {
                                    <a
                                        [routerLink]="['/' + tagUrls.detailTracklist(tag.id)]"
                                        (click)="close()"
                                        ><p-tag
                                            [value]="tag.tagName"
                                            [style.background-color]="tag.color"
                                            [style.color]="tagTextColor(tag.color)"
                                    /></a>
                                }
                            </div>
                        </td>
                    </tr>
                }
            </tbody>
        </table>
    </div>
</div>
